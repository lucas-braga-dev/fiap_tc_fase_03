name: Build and deploy EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, flag-service, targeting-service, evaluation-service, analytics-service]
    steps:

      - uses: actions/checkout@v4
    
      - name: Check Python syntax
        if: matrix.service != 'auth-service' && matrix.service != 'evaluation-service'
        run: python3 -m py_compile apps-togglemaster/src/${{ matrix.service }}/app.py
      
      - uses: actions/setup-go@v5
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        with:
          go-version-file: apps-togglemaster/src/${{ matrix.service }}/go.mod
          cache-dependency-path: apps-togglemaster/src/${{ matrix.service }}/go.sum
      - name: Go tests
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        working-directory: apps-togglemaster/src/${{ matrix.service }}
        run: go test ./...
      
      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: apps-togglemaster/src/${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ vars.DOCKERHUB_NAMESPACE || 'togglemaster-ci' }}/togglemaster-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment manifest
        run: echo "COMPOSE_B64=$(base64 -w0 deploy/compose.ec2.yaml)" >> "$GITHUB_ENV"
      - name: Pull and restart Compose on EC2
        uses: appleboy/ssh-action@v1
        env:
          COMPOSE_B64: ${{ env.COMPOSE_B64 }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          command_timeout: 12m
          envs: COMPOSE_B64,IMAGE_TAG,DOCKERHUB_NAMESPACE
          script: |
            set -eu
            : "${DOCKERHUB_NAMESPACE:?Configure DOCKERHUB_NAMESPACE}"
            cd "$HOME/fiap-tc-fase-03"
            test -s .env
            umask 077
            printf '%s' "$COMPOSE_B64" | base64 -d > compose.ec2.yaml
            export IMAGE_TAG DOCKERHUB_NAMESPACE
            docker compose --env-file .env -f compose.ec2.yaml config --quiet
            docker compose --env-file .env -f compose.ec2.yaml pull
            docker compose --env-file .env -f compose.ec2.yaml up -d --remove-orphans --wait --wait-timeout 180
            for port in 8001 8002 8003 8004 8005; do
              curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused "http://127.0.0.1:$port/health" > /dev/null
            done
            printf '%s\n' "$IMAGE_TAG" > deployed-image-tag
            docker compose --env-file .env -f compose.ec2.yaml ps
