name: DevSecOps and GitOps
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
jobs:
  configuration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.0'
      - name: Validate EKS Terraform without AWS access
        working-directory: infrasctructure/eks
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
          terraform test
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.1'
      - name: Render local and AWS Kubernetes manifests
        run: |
          kubectl kustomize gitops-manifests/k8s-manifests/base > /dev/null
          kubectl kustomize gitops-manifests/aws > /dev/null
          python3 -m unittest discover -s scripts/tests -v
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, flag-service, targeting-service, evaluation-service, analytics-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps-togglemaster/src/${{ matrix.service }}/go.sum
      - uses: actions/setup-python@v5
        if: matrix.service != 'auth-service' && matrix.service != 'evaluation-service'
        with:
          python-version: '3.11'
      - name: Go build and unit tests
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        working-directory: apps-togglemaster/src/${{ matrix.service }}
        run: |
          go build ./...
          go test -race ./...
      - name: Python dependencies and tests
        if: matrix.service != 'auth-service' && matrix.service != 'evaluation-service'
        working-directory: apps-togglemaster/src/${{ matrix.service }}
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q .
          python -m unittest discover -s . -p 'test_*.py'
      - name: Test GitOps tooling
        if: matrix.service == 'auth-service'
        run: python3 -m unittest discover -s scripts/tests -v
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, flag-service, targeting-service, evaluation-service, analytics-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps-togglemaster/src/${{ matrix.service }}/go.sum
      - uses: actions/setup-python@v5
        if: matrix.service != 'auth-service' && matrix.service != 'evaluation-service'
        with:
          python-version: '3.11'
      - name: Go static analysis
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        working-directory: apps-togglemaster/src/${{ matrix.service }}
        run: go vet ./...
      - name: Python lint
        if: matrix.service != 'auth-service' && matrix.service != 'evaluation-service'
        run: |
          python -m pip install ruff==0.17.3
          ruff check --select E9,F apps-togglemaster/src/${{ matrix.service }}
  source-security:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, flag-service, targeting-service, evaluation-service, analytics-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        with:
          go-version: '1.27.3'
          cache-dependency-path: apps-togglemaster/src/${{ matrix.service }}/go.sum
      - uses: actions/setup-python@v5
        if: matrix.service != 'auth-service' && matrix.service != 'evaluation-service'
        with:
          python-version: '3.11'
      - name: Go SAST
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        working-directory: apps-togglemaster/src/${{ matrix.service }}
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -severity high ./...
      - name: Python SAST
        if: matrix.service != 'auth-service' && matrix.service != 'evaluation-service'
        run: |
          python -m pip install bandit==1.9.4
          bandit -r apps-togglemaster/src/${{ matrix.service }} --severity-level high
      - name: SCA - block CRITICAL dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps-togglemaster/src/${{ matrix.service }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
  container-scan:
    needs: [test, lint, source-security, configuration]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, flag-service, targeting-service, evaluation-service, analytics-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: apps-togglemaster/src/${{ matrix.service }}
          load: true
          push: false
          pull: true
          # Refresh Python stages so apt security updates are never reused from cache.
          no-cache-filters: ${{ (matrix.service == 'flag-service' || matrix.service == 'targeting-service' || matrix.service == 'analytics-service') && 'builder,runtime' || '' }}
          platforms: linux/amd64
          tags: togglemaster/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Check Python runtime dependencies
        if: matrix.service == 'flag-service' || matrix.service == 'targeting-service' || matrix.service == 'analytics-service'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run --rm --entrypoint python "togglemaster/$SERVICE:$IMAGE_TAG" -m pip check
          if [ "$SERVICE" = "analytics-service" ]; then
            docker run --rm --entrypoint python "togglemaster/$SERVICE:$IMAGE_TAG" -c 'import flask, gunicorn, dotenv, werkzeug, sqlite3, boto3'
          else
            docker run --rm --entrypoint python "togglemaster/$SERVICE:$IMAGE_TAG" -c 'import flask, gunicorn, dotenv, werkzeug, sqlite3, psycopg2, requests'
          fi
      - name: Container scan - block CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: togglemaster/${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Export scanned image
        if: github.event_name != 'pull_request'
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker save "togglemaster/$SERVICE:$IMAGE_TAG" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: image-${{ matrix.service }}
          path: image.tar.gz
          retention-days: 1
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: container-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, flag-service, targeting-service, evaluation-service, analytics-service]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Publish scanned image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag "togglemaster/$SERVICE:$IMAGE_TAG" "$REGISTRY/togglemaster/$SERVICE:$IMAGE_TAG"
          docker push "$REGISTRY/togglemaster/$SERVICE:$IMAGE_TAG"
  gitops:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update scanned image tags
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          : "${AWS_ACCOUNT_ID:?Configure the AWS_ACCOUNT_ID repository variable}"
          git diff --exit-code "$IMAGE_TAG" HEAD -- apps-togglemaster/src
          python3 scripts/update-gitops-images.py --registry "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" --tag "$IMAGE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops-manifests/aws/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitOps images to $IMAGE_TAG [skip ci]"
            git push origin HEAD:main
          fi
