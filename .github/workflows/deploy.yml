name: Build and deploy EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, flag-service, targeting-service, evaluation-service, analytics-service]
    steps:

      - uses: actions/checkout@v4
    
      - name: Check Python syntax
        if: matrix.service != 'auth-service' && matrix.service != 'evaluation-service'
        run: python3 -m py_compile apps-togglemaster/src/${{ matrix.service }}/app.py
      
      - uses: actions/setup-go@v5
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        with:
          go-version-file: apps-togglemaster/src/${{ matrix.service }}/go.mod
          cache-dependency-path: apps-togglemaster/src/${{ matrix.service }}/go.sum
      - name: Go tests
        if: matrix.service == 'auth-service' || matrix.service == 'evaluation-service'
        working-directory: apps-togglemaster/src/${{ matrix.service }}
        run: go test ./...
      
      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: apps-togglemaster/src/${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ vars.DOCKERHUB_NAMESPACE || 'togglemaster-ci' }}/togglemaster-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check SSH connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          python3 - <<'PY'
          import os
          import socket
          import sys
          import time

          host = os.environ.get("EC2_HOST", "").strip()
          if not host or "://" in host or "/" in host or ":" in host:
              sys.exit("Configure EC2_HOST com apenas o IPv4 publico ou DNS da EC2, sem protocolo ou porta.")

          for attempt in range(3):
              try:
                  with socket.create_connection((host, 22), timeout=10):
                      print("Porta SSH 22 acessivel.")
                  break
              except OSError:
                  if attempt == 2:
                      sys.exit("SSH 22 inacessivel. Confira EC2 running/status checks, EC2_HOST atual, Security Group, rota publica e Network ACL. Consulte deploy/README.md: Falha de conexao SSH.")
                  time.sleep(2)
          PY
      - name: Prepare deployment manifest
        run: |
          echo "COMPOSE_B64=$(base64 -w0 deploy/compose.ec2.yaml)" >> "$GITHUB_ENV"
          echo "NGINX_B64=$(base64 -w0 deploy/nginx.conf)" >> "$GITHUB_ENV"
      - name: Pull and restart Compose on EC2
        uses: appleboy/ssh-action@v1
        env:
          COMPOSE_B64: ${{ env.COMPOSE_B64 }}
          NGINX_B64: ${{ env.NGINX_B64 }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          EC2_DEPLOY_DIR: ${{ vars.EC2_DEPLOY_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          command_timeout: 12m
          envs: COMPOSE_B64,NGINX_B64,IMAGE_TAG,DOCKERHUB_NAMESPACE,REPOSITORY_NAME,EC2_DEPLOY_DIR
          script: |
            set -Eeuo pipefail
            deploy_stage="validar configuracao"
            trap 'status=$?; printf "Falha no deploy: etapa=%s linha=%s codigo=%s\n" "$deploy_stage" "$LINENO" "$status" >&2; exit "$status"' ERR
            deploy_step() {
              deploy_stage="$1"
              printf '\n==> %s\n' "$deploy_stage"
            }
            deploy_step "validar configuracao e pasta na EC2"
            : "${DOCKERHUB_NAMESPACE:?Configure DOCKERHUB_NAMESPACE}"
            : "${REPOSITORY_NAME:?Nome do repositorio indisponivel}"
            deploy_dir="${EC2_DEPLOY_DIR:-$HOME/$REPOSITORY_NAME}"
            case "$deploy_dir" in
              /*) ;;
              *) deploy_dir="$HOME/$deploy_dir" ;;
            esac
            if [ ! -d "$deploy_dir" ]; then
              echo "Pasta de deploy inexistente: $deploy_dir. Confira o clone ou configure a variable EC2_DEPLOY_DIR no GitHub." >&2
              exit 1
            fi
            cd "$deploy_dir"
            if [ ! -s .env ]; then
              echo "Crie e preencha $deploy_dir/.env antes do deploy." >&2
              exit 1
            fi
            deploy_step "gravar manifests"
            umask 077
            printf '%s' "$COMPOSE_B64" | base64 -d > compose.ec2.yaml
            printf '%s' "$NGINX_B64" | base64 -d > nginx.conf
            export IMAGE_TAG DOCKERHUB_NAMESPACE
            deploy_step "validar Compose e variaveis do .env"
            docker compose --env-file .env -f compose.ec2.yaml config --quiet
            deploy_step "baixar imagens"
            docker compose --env-file .env -f compose.ec2.yaml pull
            deploy_step "iniciar containers"
            docker compose --env-file .env -f compose.ec2.yaml up -d --remove-orphans --wait --wait-timeout 180
            deploy_step "verificar health checks locais"
            for port in 8001 8002 8003 8004 8005; do
              curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused "http://127.0.0.1:$port/health" > /dev/null
            done
            deploy_step "validar e recarregar Nginx"
            docker compose --env-file .env -f compose.ec2.yaml exec -T proxy nginx -t
            docker compose --env-file .env -f compose.ec2.yaml exec -T proxy nginx -s reload
            deploy_step "verificar health checks pelo proxy"
            for service in auth flags targeting evaluation analytics; do
              curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused "http://127.0.0.1/$service/health" > /dev/null
            done
            deploy_step "registrar versao implantada"
            printf '%s\n' "$IMAGE_TAG" > deployed-image-tag
            docker compose --env-file .env -f compose.ec2.yaml ps
