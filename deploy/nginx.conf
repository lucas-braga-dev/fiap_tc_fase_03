map $service $backend {
    auth auth-service:8001;
    flags flag-service:8002;
    targeting targeting-service:8003;
    evaluation evaluation-service:8004;
    analytics analytics-service:8005;
}

server {
    listen 80;
    server_name _;

    # Docker DNS: resolve novamente quando os containers forem recriados.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/(auth|flags|targeting|evaluation|analytics)/(.*)$ {
        set $service $1;
        set $endpoint /$2;
        proxy_pass http://$backend$endpoint$is_args$args;
    }

    location / {
        return 404;
    }
}
